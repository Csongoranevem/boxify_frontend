<h1>Az én dobozaim</h1>
<p-table [value]="boxes" [paginator]="true" [rows]="10" [responsiveLayout]="'scroll'" class="col col-xl-4 col-lg-8 col-md-8 col-sm-12">
    <ng-template pTemplate="header">
        <tr>
            <th>ID</th>
            <th>Név</th>
            <th>Frissítve</th>
            <th>Műveletek</th>
        </tr>
    </ng-template>
    <ng-template pTemplate="body" let-box>
        <tr>
            <td>{{ box.id }}</td>
            <td>{{ box.name }}</td>
            <td>{{ box.updatedAt }}</td>
            <td>
                <p-button label="Szerkesztés" icon="pi pi-pencil" class="changeBtn w-50" severity="info"></p-button>
                <p-button label="Törlés" icon="pi pi-trash" class="deleteBtn w-50" severity="danger"></p-button>
            </td>
        </tr>
    </ng-template>
</p-table>
