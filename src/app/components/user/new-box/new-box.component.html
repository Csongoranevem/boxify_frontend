<div class="card xs:col-12 md:col-6 lg:col-4 mx-auto px-3 text-center">
    <h1 class="mx-auto">Új doboz létrehozása</h1>

    <div class="mb-4 col col-xl-4 col-lg-4 col-md-6 col-sm-12">
        <p-floatLabel>
            <input pInputText id="code" [(ngModel)]="newBox.code" class="w-full" maxLength="15" />
            <label for="code">Kód</label>
            <small class="p-text-secondary">{{ newBox.code.length }}/15</small>
        </p-floatLabel>
    </div>

    <div class="mb-4 col col-xl-4 col-lg-4 col-md-6 col-sm-12">
        <p-floatLabel>
            <input pInputText id="labelType" [(ngModel)]="newBox.labelType" class="w-full" disabled />
            <label for="labelType">Típus</label>
        </p-floatLabel>
    </div>

    <div class="size">
        <div class="mb-4 col col-xl-4 col-lg-4 col-md-6 col-sm-12">
            <p-floatLabel>
                <p-inputnumber inputId="integeronly" [(ngModel)]="newBox.lengthCm" [showButtons]="true" [min]="0" />
                <label for="lengthCm">Hossz (cm)</label>
            </p-floatLabel>
        </div>

        <div class="mb-4 col col-xl-4 col-lg-4 col-md-6 col-sm-12">
            <p-floatLabel>
                <p-inputnumber inputId="integeronly" [(ngModel)]="newBox.widthCm" [showButtons]="true" [min]="0" />
                <label for="widthCm">Szélesség (cm)</label>
            </p-floatLabel>
        </div>

        <div class="mb-4 col col-xl-4 col-lg-4 col-md-6 col-sm-12">
            <p-floatLabel>
                <p-inputnumber inputId="integeronly" [(ngModel)]="newBox.heightCm" [showButtons]="true" [min]="0" />
                <label for="heightCm">Magasság (cm)</label>
            </p-floatLabel>
        </div>
        <div class="mb-4 col col-xl-4 col-lg-4 col-md-6 col-sm-12">
            <p-floatLabel>
                <p-inputnumber inputId="integeronly" [(ngModel)]="newBox.maxWeightKg" [showButtons]="true" [min]="0" />
                <label for="maxWeightKg">Max. súly (kg)</label>
            </p-floatLabel>
        </div>
    </div>



    <div class="mb-4 col col-xl-4 col-lg-4 col-md-6 col-sm-12">
        <p-floatlabel>
            <textarea pTextarea id="over_label" [(ngModel)]="newBox.note" rows="5" style="resize: none"
                class="h-full w-full"></textarea>
            <label for="over_label">Leírás</label>
        </p-floatlabel>
    </div>


    <p-button label="Mentés" icon="pi pi-plus" (click)="createBox()" class="w-full" />
