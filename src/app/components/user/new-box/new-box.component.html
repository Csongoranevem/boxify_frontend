<div id="newBoxContainer">
    <div class="formContainer">
        <h1>Új doboz létrehozása</h1>
        <div class="mb-4 col col-xl-4 col-lg-4 col-md-6 col-sm-12 boxName">
            <p-floatLabel>
                <input pInputText id="boxName" [(ngModel)]="boxName" class="w-full" />
                <label for="boxName">Box Name</label>
            </p-floatLabel>
        </div>

        <div class="mb-4 col col-xl-4 col-lg-4 col-md-6 col-sm-12">
            <p-floatLabel class="mb-4 boxSize">
                <input pInputText id="szelesseg" [(ngModel)]="boxSize.width" class="w-full" />
                <label for="szelesseg">Szélesség (cm)</label>
            </p-floatLabel>

            <p-floatLabel class="mb-4 boxSize">
                <input pInputText id="magassag" [(ngModel)]="boxSize.length" class="w-full" />
                <label for="magassag">Hossz (cm)</label>
            </p-floatLabel>

            <p-floatLabel class="mb-4 boxSize">
                <input pInputText id="melyseg" [(ngModel)]="boxSize.height" class="w-full" />
                <label for="melyseg">Magasság (cm)</label>
            </p-floatLabel>
        </div>

        <p-button label="Létrehozás" icon="pi pi-plus" (click)="createBox()" class="createBtn"></p-button>
    </div>
    <img src="logo.ico" alt="Boxify logo">

</div>


<p-message *ngIf="errorMessage" severity="error" class="p-absolute top-0 left-0">{{errorMessage}}</p-message>
